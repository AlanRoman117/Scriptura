<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: on Android Chrome the layout viewport shrinks for the
         keyboard, so dvh and innerHeight tell the truth. iOS ignores it; there the visual
         viewport is published by src/lib/viewport.ts and the stylesheet sizes from that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171614" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-512.svg" />
    <title>Scriptura Reader</title>
    <!--
      Display preferences, applied before the first paint.

      The stylesheet loads before the app's module script runs, so without this
      a reader who pinned a light theme on a dark-mode phone sees dark paper for
      as long as the bundle takes to start. This is the same logic as
      src/lib/prefs.ts, kept deliberately small; tests/unit/prefs.test.ts asserts
      the two agree on the storage key, the attributes and the properties.

      The page's language is set here too, so a screen reader starts in the
      right voice: the chosen language, else the first of the device's
      languages the app has (src/i18n/locales.ts), else English.
    -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('scriptura-display') || '{}') || {};
        var r = document.documentElement;
        var themes = { light: '#faf9f7', dark: '#171614', 'hc-light': '#ffffff', 'hc-dark': '#000000', sepia: '#f4ecd8' };
        var spacing = { normal: ['1.75', '.85rem'], relaxed: ['1.9', '2.85em'], loose: ['2.1', '3.15em'] }[p.spacing] || ['1.75', '.85rem'];
        var measure = { narrow: '56ch', normal: '64ch', wide: '70ch' }[p.measure] || '64ch';
        if (themes[p.theme]) r.setAttribute('data-theme', p.theme);
        if (p.motion === 'reduce') r.setAttribute('data-motion', 'reduce');
        if (p.markers === true) r.setAttribute('data-markers', 'true');
        if ([112, 125, 150, 175, 200].indexOf(p.textSize) !== -1) r.style.setProperty('--text-scale', String(p.textSize / 100));
        r.style.setProperty('--reading-leading', spacing[0]);
        r.style.setProperty('--verse-gap', spacing[1]);
        r.style.setProperty('--measure', measure);
        var locales = ['en-US', 'es-MX', 'fr-FR', 'ja-JP'];
        var byLanguage = { en: 'en-US', es: 'es-MX', fr: 'fr-FR', ja: 'ja-JP' };
        var lang = locales.indexOf(p.language) !== -1 ? p.language : '';
        var device = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
        for (var i = 0; !lang && i < device.length; i++) lang = byLanguage[String(device[i]).split(/[-_]/)[0].toLowerCase()] || '';
        r.setAttribute('lang', lang || 'en-US');
        if (themes[p.theme]) document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = themes[p.theme]; });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
