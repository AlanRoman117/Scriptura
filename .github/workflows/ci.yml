name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Data integrity and licence enforcement. Kept separate from the TypeScript
  # job so a bad translation and a bad build are visibly different failures,
  # and so this still runs if the code job breaks.
  validate-data:
    name: Validate translation data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # No pip install: scripts/validate.py is standard library only.
      # No --strict: versification warnings are legitimate and must not fail
      # the build. See CLAUDE.md → Critical Rules → Data validation.
      - run: python scripts/validate.py
      # The canon is defined in three places, in two languages. This checks
      # they still agree with each other and with the committed data — the
      # discipline was manual until canon.ts drifted on 45 of 66 books
      # unnoticed, because nothing read the field.
      - run: python scripts/check-canon-sync.py

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Read from .nvmrc so the Node version lives in exactly one place.
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # `lint` is `tsc --build` — TypeScript rejects --noEmit on composite
      # project references (TS6310), so the build is the type-check.
      - run: npm run lint
      - run: npm test
      # Smoke the static API builder. --skip-verses keeps it to a few hundred
      # files rather than ~12,500 while still exercising every code path.
      - run: npm run build:api -- --skip-verses

  # HTTP contract tests. Separate from build-and-test because these boot a real
  # server and assert things jest structurally cannot see — status lines,
  # headers, CORS, HTTP methods. Playwright runs in API mode, so no browsers are
  # installed; `npx playwright install` is deliberately absent.
  contract:
    name: API contract (HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:contract
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
